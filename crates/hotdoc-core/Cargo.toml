[package]
name = "hotdoc-core"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hotdoc-cli"
path = "src/bin/hotdoc-cli.rs"

[dependencies]
tantivy = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
arboard = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true