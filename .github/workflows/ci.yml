name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, format, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

      - name: Dependency audit (SEC-6)
        run: pnpm audit --audit-level=high

      - name: String extraction gate (NFR-10, T8)
        run: pnpm run string:check

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet 2>/dev/null || true

      - name: Dependency audit (SEC-6)
        run: cargo audit

      - name: Test
        run: cargo test --workspace

      - name: Build golden-query index
        working-directory: src-tauri
        run: cargo run -p hotdoc-core --bin hotdoc-cli -- index --out target/bench-index

      - name: Golden query bench (NFR-3)
        working-directory: src-tauri
        run: cargo run -p hotdoc-core --bin hotdoc-cli -- bench --index target/bench-index

      - name: Eval harness — precision@1/@3 + MRR floors (NFR-3)
        working-directory: src-tauri
        run: cargo run -p hotdoc-core --bin hotdoc-cli -- eval --index target/bench-index

      - name: Index size gate (NFR-6, T7)
        run: bash scripts/nfr-index-size.sh src-tauri/target/bench-index packs/curate

      - name: Open-time bench (NFR-1 index-build portion)
        working-directory: src-tauri
        run: cargo run --release -p hotdoc-core --bin bench-open

      - name: Search p50 bench (NFR-2)
        working-directory: src-tauri
        run: cargo run -p hotdoc-core --bin bench-search

  nfr-build-gates:
    name: NFR build gates (T4/T5/T6/T8-NFR7)
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/

      - name: Install Linux Tauri + display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            xdotool \
            netcat-openbsd \
            openbox

      - name: Build Tauri app (release)
        run: pnpm tauri build --bundles deb
        env:
          # Silence Tauri's interactive update prompts in CI.
          TAURI_SIGNING_PRIVATE_KEY: ""
          CI: "true"

      - name: Install size gate (NFR-5, T6)
        run: bash scripts/nfr-install-size.sh target/release/bundle

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1

      # NFR-4 measures IDLE memory — the window is visible:false (hidden) until
      # the hotkey. Run it under bare Xvfb, BEFORE starting a window manager: a
      # WM maps and composites the hidden window, forcing WebKit to allocate
      # render buffers (~+100MB) that a genuinely idle app never holds. The
      # memory gate needs no window (pure launch + soak), only the open-time
      # bench does.
      - name: Idle memory gate (NFR-4, T5)
        env:
          SOAK_SECONDS: "30"
        run: bash scripts/nfr-memory.sh target/release/hotdoc

      - name: Start window manager
        run: |
          # A window manager is required for the webview to expose EWMH
          # properties (WM_NAME/visibility) that the open-time bench detects
          # via xdotool; bare Xvfb leaves windows unnamed and unfindable.
          DISPLAY=:99 openbox &
          echo "WM_PID=$!" >> "$GITHUB_ENV"
          sleep 1

      - name: Open-time E2E bench (NFR-1, T4)
        run: bash scripts/nfr-open-bench.sh target/release/hotdoc 30

      - name: Network monitor gate (NFR-7, T8)
        run: sudo --preserve-env=DISPLAY bash scripts/nfr-network.sh target/release/hotdoc 60

      - name: Stop Xvfb + window manager
        if: always()
        run: |
          kill "$WM_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
