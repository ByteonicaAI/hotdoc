[package]
name = "hotdoc"
version = "0.4.0"
description = "hotdoc — keyboard-driven local command reference launcher"
authors = ["Rohit Kumar Bindal <tattoo.65-stoles@icloud.com>"]
edition = "2021"

[lib]
name = "hotdoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
hotdoc-core = { path = "../crates/hotdoc-core" }

[lints]
workspace = true
